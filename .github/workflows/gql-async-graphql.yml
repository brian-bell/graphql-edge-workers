name: gql-async-graphql

permissions:
  contents: read
  packages: read

on:
  push:
    branches: [main]
    paths:
      - '.github/docker/gql-async-graphql-ci/**'
      - '.github/workflows/gql-async-graphql.yml'
      - 'workers/gql-async-graphql/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  pull_request:
    paths:
      - '.github/docker/gql-async-graphql-ci/**'
      - '.github/workflows/gql-async-graphql.yml'
      - 'workers/gql-async-graphql/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/gql-async-graphql-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: ${{ runner.os }}-cargo-async-graphql-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-async-graphql-

      - name: Test
        run: cargo test -p gql-async-graphql

      - name: Build
        run: cargo build --target wasm32-unknown-unknown --release -p gql-async-graphql
